<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f13"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
<title>Prosek Volejbal</title>
</head>
<body>
<main id="calendarTab" class="app">
<header class="topbar"><div><div class="eyebrow">PROSEK VOLEJBAL</div><h1 id="monthTitle"></h1></div><button class="icon-btn" id="todayBtn">Dnes</button></header>
<section class="calendar-card"><div class="calendar-nav"><button id="prevBtn">‹</button><button id="nextBtn">›</button></div>
<div class="weekdays"><span>Po</span><span>Út</span><span>St</span><span>Čt</span><span>Pá</span><span>So</span><span>Ne</span></div><div id="calendar" class="calendar"></div></section>
<div class="filters"><button class="filter active" data-filter="Vše">Vše</button><button class="filter" data-filter="U18">U18</button><button class="filter" data-filter="U20">U20</button><button class="filter" data-filter="U22">U22</button><button class="filter" data-filter="Trénink">Tréninky</button></div>
<section><div class="section-title"><h2>Všechny zápasy</h2><span id="syncStatus">Načítám…</span></div><div id="events"></div></section>
</main>
<section id="webTab" class="panel hidden"><h2>Prosek Web</h2><div class="web-shell"><iframe src="https://www.volejbalek.cz/" title="Volejbal SK Prosek"></iframe></div><a class="secondary" href="https://www.volejbalek.cz/" target="_blank" rel="noopener">Otevřít web samostatně</a></section>
<section id="settingsTab" class="panel hidden"><h2>Nastavení</h2><label class="setting"><span>Tmavý režim</span><input id="darkMode" type="checkbox" checked></label><p class="hint">Data zápasů se aktualizují přes GitHub Actions.</p></section>
<nav class="tabbar"><button class="tab active" data-tab="calendarTab">📅<span>Kalendář</span></button><button class="tab" data-tab="webTab">🌐<span>Prosek Web</span></button><button class="tab" data-tab="settingsTab">⚙️<span>Nastavení</span></button></nav>
<script src="app.js"></script>
</body></html>
