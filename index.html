<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Prosek Volejbal</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">PROSEK VOLEJBAL</div>
        <h1 id="monthTitle"></h1>
      </div>
      <button class="icon-btn" id="todayBtn" aria-label="Dnes">●</button>
    </header>

    <section class="calendar-card">
      <div class="calendar-nav">
        <button id="prevBtn">‹</button>
        <button id="nextBtn">›</button>
      </div>
      <div class="weekdays">
        <span>Po</span><span>Út</span><span>St</span><span>Čt</span><span>Pá</span><span>So</span><span>Ne</span>
      </div>
      <div id="calendar" class="calendar"></div>
    </section>

    <section class="filters" id="filters">
      <button class="filter active" data-filter="Vše">Vše</button>
      <button class="filter" data-filter="U18">U18</button>
      <button class="filter" data-filter="U20">U20</button>
      <button class="filter" data-filter="U22">U22</button>
      <button class="filter" data-filter="Trénink">Tréninky</button>
    </section>

    <section>
      <div class="section-title">
        <h2>Nejbližší události</h2>
        <span id="syncStatus">Ukázková data</span>
      </div>
      <div id="events" class="events"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="calendarTab">📅<span>Kalendář</span></button>
    <button class="tab" data-tab="webTab">🌐<span>Web</span></button>
    <button class="tab" data-tab="settingsTab">⚙️<span>Nastavení</span></button>
  </nav>

  <section id="webTab" class="panel hidden">
    <h2>Web Proseku</h2>
    <p>Oficiální web volejbalek.cz otevřeš v novém okně.</p>
    <a class="primary" href="https://www.volejbalek.cz/" target="_blank" rel="noopener">Otevřít volejbalek.cz</a>
    <a class="secondary" href="https://www.cvf.cz/" target="_blank" rel="noopener">Otevřít ČVS</a>
  </section>

  <section id="settingsTab" class="panel hidden">
    <h2>Nastavení</h2>
    <label class="setting"><span>Tmavý režim</span><input id="darkMode" type="checkbox" checked></label>
    <label class="setting"><span>Automatická aktualizace</span><input id="autoUpdate" type="checkbox" checked></label>
    <p class="hint">Napojení na živá data ČVS přidáme v další fázi.</p>
  </section>

  <script src="app.js"></script>
</body>
</html>
